# PNK Security — VirtualHost Apache con TLS (producción)
# Resuelve EXC-01: TLS/HTTPS, redirección y cookies Secure.
# Requisitos: mod_ssl, mod_headers, mod_rewrite habilitados.
# El certificado real se obtiene con certbot (Let's Encrypt), no autofirmado.

<VirtualHost *:80>
    ServerName tu-dominio.cl
    # Forzar HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName tu-dominio.cl
    DocumentRoot "/ruta/a/pnkSecurity/pnkSecurity"

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/tu-dominio.cl/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/tu-dominio.cl/privkey.pem
    SSLProtocol             -all +TLSv1.2 +TLSv1.3

    # La aplicación detecta HTTPS directo; no se necesita TRUST_PROXY aquí.
    # Si hubiese un balanceador delante, poner TRUST_PROXY=true en config.local.php.

    <Directory "/ruta/a/pnkSecurity/pnkSecurity">
        AllowOverride All
        Require all granted
    </Directory>

    # Oculta la versión del servidor
    ServerTokens Prod
    ServerSignature Off
    TraceEnable Off
</VirtualHost>
